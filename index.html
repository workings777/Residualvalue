<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잔존가치 계산기</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function formatComma(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function getLastDayOfMonth(y, m) {
  return new Date(y, m, 0).getDate();
}

function App() {
  const [period, setPeriod]   = useState(null);
  const [amount, setAmount]   = useState('');
  const [year,   setYear]     = useState('');
  const [month,  setMonth]    = useState('');
  const [day,    setDay]      = useState('');
  const [result, setResult]   = useState(null);

  const chartRef      = useRef(null);
  const chartInstance = useRef(null);

  /* ── 금액 실시간 콤마 ── */
  function handleAmountChange(e) {
    const raw = e.target.value.replace(/,/g, '');
    if (!/^\d*$/.test(raw)) return;
    setAmount(raw ? formatComma(raw) : '');
  }

  /* ── 계산하기 ── */
  function handleCalculate() {
    if (!period) {
      alert('상각 기간을 선택해주세요.');
      return;
    }

    const rawAmount = parseInt(amount.replace(/,/g, '') || '0', 10);
    if (!rawAmount || rawAmount <= 0) {
      alert('구매 금액을 입력해주세요.');
      return;
    }

    const y = parseInt(year,  10);
    const m = parseInt(month, 10);
    const d = parseInt(day,   10);

    if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > getLastDayOfMonth(y, m)) {
      alert('올바른 구매일을 입력해주세요.');
      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const purchaseDate = new Date(y, m - 1, d);
    if (purchaseDate > today) {
      alert('구매일은 오늘 이후일 수 없습니다.');
      return;
    }

    const curY = today.getFullYear();
    const curM = today.getMonth() + 1;

    /* 경과 개월 = (현재 말일) - (구매 말일) → 월 차이로 계산 */
    const elapsed  = (curY - y) * 12 + (curM - m);
    const totalMon = period;
    const remaining = Math.max(totalMon - elapsed, 0);
    const residual  = remaining > 0 ? Math.round(rawAmount * remaining / totalMon) : 0;

    /* 연도별 데이터 (0년~만료년) */
    const totalYears = Math.ceil(totalMon / 12);
    const chartData  = [];
    for (let i = 0; i <= totalYears; i++) {
      const used = i * 12;
      const rem  = Math.max(totalMon - used, 0);
      const val  = rem > 0 ? Math.round(rawAmount * rem / totalMon) : 0;
      chartData.push({ label: `${i}년`, value: val });
    }

    setResult({ residual, elapsed, remaining, rawAmount, totalMon, chartData });
  }

  /* ── 초기화 ── */
  function handleReset() {
    setPeriod(null);
    setAmount('');
    setYear('');
    setMonth('');
    setDay('');
    setResult(null);
    if (chartInstance.current) {
      chartInstance.current.destroy();
      chartInstance.current = null;
    }
  }

  /* ── 차트 렌더 ── */
  useEffect(() => {
    if (!result || !chartRef.current) return;

    if (chartInstance.current) chartInstance.current.destroy();

    chartInstance.current = new Chart(chartRef.current, {
      type: 'bar',
      data: {
        labels: result.chartData.map(d => d.label),
        datasets: [{
          label: '잔존가치',
          data:  result.chartData.map(d => d.value),
          backgroundColor: 'rgba(59,130,246,0.65)',
          borderColor:     'rgb(59,130,246)',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `  ${formatComma(ctx.raw)}원`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: val => `${formatComma(val)}원`,
              maxTicksLimit: 5,
            },
            grid: { color: 'rgba(0,0,0,0.05)' }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });
  }, [result]);

  /* ── 감가율 % ── */
  const depreciatedPct = result
    ? Math.round((1 - result.residual / result.rawAmount) * 100)
    : 0;

  return (
    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 py-10">
      <div className="bg-white rounded-2xl shadow-md w-full max-w-lg p-8">

        {/* Header */}
        <h1 className="text-2xl font-bold text-gray-800 mb-1 text-center">잔존가치 계산기</h1>
        <p className="text-sm text-gray-400 text-center mb-7">구매 금액과 시점을 입력해 현재 잔존가치를 계산합니다</p>

        {/* 상각 기간 */}
        <div className="mb-5">
          <label className="block text-sm font-semibold text-gray-600 mb-2">상각 기간 <span className="text-red-400">*</span></label>
          <div className="flex gap-3">
            {[{ label: '5년 (60개월)', value: 60 }, { label: '15년 (180개월)', value: 180 }].map(opt => (
              <button
                key={opt.value}
                onClick={() => setPeriod(opt.value)}
                className={`flex-1 py-2.5 rounded-lg border-2 text-sm font-medium transition-all ${
                  period === opt.value
                    ? 'border-blue-500 bg-blue-50 text-blue-700'
                    : 'border-gray-200 text-gray-500 hover:border-gray-300'
                }`}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        {/* 구매 금액 */}
        <div className="mb-5">
          <label className="block text-sm font-semibold text-gray-600 mb-2">구매 금액 (원)</label>
          <div className="relative">
            <input
              type="text"
              inputMode="numeric"
              value={amount}
              onChange={handleAmountChange}
              placeholder="0"
              className="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-right text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400 pr-8"
            />
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">원</span>
          </div>
        </div>

        {/* 구매일 */}
        <div className="mb-7">
          <label className="block text-sm font-semibold text-gray-600 mb-2">구매일</label>
          <div className="flex gap-2 items-center">
            <input
              type="text"
              inputMode="numeric"
              value={year}
              onFocus={() => setYear('')}
              onChange={e => setYear(e.target.value.replace(/\D/g,'').slice(0,4))}
              placeholder="YYYY"
              maxLength={4}
              className="w-24 border border-gray-200 rounded-lg px-2 py-2.5 text-center text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <span className="text-gray-400 text-sm">년</span>
            <input
              type="text"
              inputMode="numeric"
              value={month}
              onFocus={() => setMonth('')}
              onChange={e => setMonth(e.target.value.replace(/\D/g,'').slice(0,2))}
              placeholder="MM"
              maxLength={2}
              className="w-16 border border-gray-200 rounded-lg px-2 py-2.5 text-center text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <span className="text-gray-400 text-sm">월</span>
            <input
              type="text"
              inputMode="numeric"
              value={day}
              onFocus={() => setDay('')}
              onChange={e => setDay(e.target.value.replace(/\D/g,'').slice(0,2))}
              placeholder="DD"
              maxLength={2}
              className="w-16 border border-gray-200 rounded-lg px-2 py-2.5 text-center text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <span className="text-gray-400 text-sm">일</span>
          </div>
        </div>

        {/* 버튼 */}
        <div className="flex gap-3 mb-6">
          <button
            onClick={handleCalculate}
            className="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition-colors"
          >
            계산하기
          </button>
          <button
            onClick={handleReset}
            className="px-6 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold py-3 rounded-lg transition-colors"
          >
            초기화
          </button>
        </div>

        {/* 결과창 */}
        {result && (
          <div className="border border-blue-100 bg-blue-50 rounded-xl p-6 space-y-4">
            {/* 잔존가치 */}
            <div>
              <p className="text-xs text-gray-500 mb-0.5">현재 잔존가치</p>
              <p className="text-4xl font-bold text-blue-600">{formatComma(result.residual)}<span className="text-xl ml-1">원</span></p>
            </div>

            {/* 요약 */}
            <div className="flex gap-4 text-sm text-gray-500 border-t border-blue-100 pt-3">
              <div>
                <span className="text-gray-400">경과</span>
                <span className="ml-1 font-semibold text-gray-700">{result.elapsed}개월</span>
              </div>
              <div>
                <span className="text-gray-400">잔여</span>
                <span className="ml-1 font-semibold text-gray-700">{result.remaining}개월</span>
              </div>
              <div>
                <span className="text-gray-400">감가율</span>
                <span className="ml-1 font-semibold text-gray-700">{depreciatedPct}%</span>
              </div>
            </div>

            {/* 그래프 */}
            <div className="border-t border-blue-100 pt-4">
              <p className="text-xs font-semibold text-gray-500 mb-3">연도별 잔존가치 추이</p>
              <canvas ref={chartRef}></canvas>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
